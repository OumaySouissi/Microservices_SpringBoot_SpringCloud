<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#ffffff; font-family: Segoe UI, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e293b">TP3 SOA - Spring Boot &amp; Spring Cloud Microservices Architecture</text>

  <!-- Client -->
  <rect x="50" y="220" width="120" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="250" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">HTTP Client</text>
  <text x="110" y="270" font-size="11" text-anchor="middle" fill="#475569">Browser / Curl</text>

  <!-- Arrow Client -> Proxy -->
  <line x1="170" y1="255" x2="230" y2="255" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="245" font-size="10" text-anchor="middle" fill="#64748b">:9999</text>

  <!-- Proxy Service (Gateway) -->
  <rect x="230" y="190" width="170" height="130" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="315" y="225" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">proxy-service</text>
  <text x="315" y="245" font-size="12" text-anchor="middle" fill="#e0e7ff">Spring Cloud Gateway</text>
  <text x="315" y="265" font-size="11" text-anchor="middle" fill="#c7d2fe">Port: 9999 (Reactive)</text>
  <text x="315" y="285" font-size="10" text-anchor="middle" fill="#e0e7ff">Client-side LoadBalancer</text>
  <text x="315" y="303" font-size="9" text-anchor="middle" fill="#c7d2fe">StripPrefix=1</text>

  <!-- Discovery Service (Eureka) -->
  <rect x="470" y="60" width="180" height="100" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="560" y="95" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">discovery-service</text>
  <text x="560" y="115" font-size="12" text-anchor="middle" fill="#d1fae5">Netflix Eureka Server</text>
  <text x="560" y="135" font-size="11" text-anchor="middle" fill="#a7f3d0">Port: 8761</text>

  <!-- Config Service -->
  <rect x="230" y="370" width="170" height="100" rx="10" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="315" y="405" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">config-service</text>
  <text x="315" y="425" font-size="12" text-anchor="middle" fill="#ede9fe">Spring Cloud Config</text>
  <text x="315" y="445" font-size="11" text-anchor="middle" fill="#ddd6fe">Port: 8888 (Native /myConfig)</text>

  <!-- Product Service Instances -->
  <!-- Instance 1 -->
  <rect x="680" y="150" width="180" height="65" rx="8" fill="url(#amberGrad)" filter="url(#shadow)"/>
  <text x="770" y="175" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">product-service #1</text>
  <text x="770" y="195" font-size="11" text-anchor="middle" fill="#fef3c7">Port: 8080 | H2 In-Memory</text>

  <!-- Instance 2 -->
  <rect x="680" y="235" width="180" height="65" rx="8" fill="url(#amberGrad)" filter="url(#shadow)"/>
  <text x="770" y="260" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">product-service #2</text>
  <text x="770" y="280" font-size="11" text-anchor="middle" fill="#fef3c7">Port: 8081 | H2 In-Memory</text>

  <!-- Instance 3 -->
  <rect x="680" y="320" width="180" height="65" rx="8" fill="url(#amberGrad)" filter="url(#shadow)"/>
  <text x="770" y="345" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">product-service #3</text>
  <text x="770" y="365" font-size="11" text-anchor="middle" fill="#fef3c7">Port: 8082 | H2 In-Memory</text>

  <!-- Connections -->
  <!-- Proxy -> Eureka (Fetch registry) -->
  <path d="M 360 190 Q 400 130 470 115" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
  <text x="430" y="160" font-size="10" fill="#047857">Fetch Registry</text>

  <!-- Products -> Eureka (Register) -->
  <path d="M 680 170 Q 640 130 650 110" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4"/>
  <path d="M 680 250 Q 630 180 650 130" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4"/>
  <path d="M 680 330 Q 620 220 650 145" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="645" y="200" font-size="10" fill="#047857">Register (Heartbeat)</text>

  <!-- Proxy -> Products (Load balanced routing) -->
  <line x1="400" y1="230" x2="680" y2="185" stroke="#3b82f6" stroke-width="2"/>
  <line x1="400" y1="255" x2="680" y2="265" stroke="#3b82f6" stroke-width="2"/>
  <line x1="400" y1="280" x2="680" y2="345" stroke="#3b82f6" stroke-width="2"/>
  <text x="510" y="280" font-size="11" font-weight="bold" fill="#1d4ed8">Round-Robin (lb://product-service)</text>

  <!-- Config -> Services -->
  <path d="M 400 420 Q 550 430 680 355" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3"/>
  <text x="530" y="415" font-size="10" fill="#6d28d9">Import Config on startup</text>
</svg>
